name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: brainnel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting (skip on error)
      run: npm run lint || echo "Linting failed but continuing..."
      
    - name: Build project
      run: npm test && npm run build:prod

    # The site is built once, here. The web server (2 vCPU, 3.8 GiB) only publishes the archive,
    # so a deploy never competes with visitors for its CPU.
    - name: Package build
      id: package
      run: |
        set -euo pipefail
        test -f dist/index.html
        ARCHIVE="brainnel-dist-${GITHUB_SHA}.tgz"
        tar -C dist -czf "$ARCHIVE" .
        echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
        echo "sha256=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Prepare upload directory
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        script: mkdir -p /home/admin/cod-deploy-artifacts

    - name: Upload build
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        source: ${{ steps.package.outputs.archive }}
        target: /home/admin/cod-deploy-artifacts

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          set -eu
          cd /home/admin/projects/cod-ecommerce

          # Preserve local changes; a dirty or diverged checkout requires review.
          git fetch origin main
          if [ -n "$(git status --porcelain)" ]; then
            echo "Deployment stopped: server checkout has local changes; nothing was discarded."
            git status --short
            exit 1
          fi
          git merge --ff-only origin/main

          # Publish the archive built above (checksum verified; nothing is built on this host).
          # Do not chmod the tracked file and make the checkout dirty.
          bash deploy-ci.sh --dist /home/admin/cod-deploy-artifacts/${{ steps.package.outputs.archive }} --sha256 ${{ steps.package.outputs.sha256 }}
          
    - name: Notify deployment status
      run: |
        echo "🎉 Deployment completed!"
        echo "🌐 Website: https://www.brainnel.com"
        echo "📅 Deploy time: $(date)"
